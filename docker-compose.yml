services:
  mysql:
    image: mysql:8.0.41
    platform: linux/amd64
    container_name: atp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: atp_db
      MYSQL_USER: atp_user
      MYSQL_PASSWORD: atp_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data_v2:/var/lib/mysql


volumes:
  db_data_v2: